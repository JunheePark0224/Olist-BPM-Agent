# ab_test_design.yaml
#
# [Human Approval] A/B Test 설계
#
# 시나리오 선정: S1 (RJ Delivery Optimization)
# 선정 근거: RCA(④)에서 통계적으로 가장 중요한 원인으로 확인된 변수
#            (customer_state, effect_size_pct=20.19%, 5개 threshold 통과
#            변수 중 1위)를 기준으로 Human이 선택.
#
# 설계 원칙: 노트북에서는 "배송시간 단축 → 지연율 감소"를 시뮬레이션으로
# 추정해 MDE 근거로 사용했으나, 이는 특정 데이터셋에서는 합리적인
# What-if 분석이었을 뿐, 배송시간과 KPI 간의 관계는 기업마다 다를 수
# 있어 범용 Agent에 일반화하기 어렵다. 따라서 이번 설계에서는 검증된
# 사실(현재 baseline, 실제 트래픽)까지만 사용하고, MDE는 시뮬레이션이
# 아니라 비즈니스 목표(절대값 1%p 개선)로 직접 설정하였다. 실제 개선
# 효과는 A/B 테스트를 통해 검증한다.

scenario:
  id: S1
  title: RJ Delivery Time Optimization
  root_cause: Geography
  variable: customer_state
  target: RJ
  selection_reason: >
    Human reviewed the four recommended scenarios (S1-S4) and selected
    S1 because Geography showed the largest statistical effect size
    (20.19%) among the RCA-validated causes, while also representing
    a high business impact (Impact Score 788,027).

# ① 비즈니스 문제 정의
problem_statement: >
  RJ주 배송(carrier_delivery_time)의 평균 소요시간과 지연율이 전체 평균
  대비 유의하게 높다. 지역 물류 최적화를 통해 이 격차를 줄일 수 있는지
  검증한다.

# ② 가설
hypothesis:
  h0: RJ주 배송 최적화 조치는 Delivery Delay Rate에 유의미한 변화를 주지 않는다.
  h1: RJ주 배송 최적화 조치 적용 시 Delivery Delay Rate가 감소한다.

# ③ 실험 단위
experiment_unit: Fulfillment Center
experiment_unit_note: >
  실제 운영에서는 RJ주를 담당하는 물류 거점 단위 랜덤 배정이 적절하다.
  Olist 공개 데이터셋에는 물류 거점 정보가 없어, 본 설계는 개념적
  A/B Test 설계로 제시한다.
treatment: 배송 최적화 조치 적용 거점 (RJ 담당)
control: 기존 운영 유지 거점

# ④ Metric 정의
metrics:
  primary: Delivery Delay Rate (%)
  secondary: Carrier Delivery Time (hours)
  guardrail:
    - Cancellation Rate
    - Customer Complaint Rate

# ⑤ Baseline (processed_dataset.parquet에서 실제 계산한 값)
baseline:
  target_group: RJ
  delay_rate_pct: 13.60
  avg_carrier_delivery_time_hours: 289.3
  order_count_historical: 12210
  reference: 전체 지연율 8.20% 대비 RJ 13.60%로 5.40%p 높음

# ⑥ MDE (Minimum Detectable Effect)
# 시뮬레이션이 아닌 비즈니스 목표로 직접 설정
mde:
  value_pct: 1.0
  basis: business_target
  target_delay_rate_pct: 12.60
  note: >
    A 1.0 percentage-point reduction was selected as a realistic and
    operationally meaningful business objective for an initial
    experiment, rather than a value derived from simulation. The
    exact relationship between delivery time reduction and delay
    rate reduction has not been empirically validated, so the MDE
    is set as a business target to be tested, not assumed.

# ⑦ Power Analysis
power_analysis:
  alpha: 0.05
  power: 0.80
  baseline_pct: 13.60
  target_pct: 12.60
  sample_size_per_group: 14375
  sample_size_total: 28749

# ⑧ 실험 기간 추정
# 실제 A/B Test는 과거 데이터가 아니라 향후 유입되는 신규 트래픽으로
# 진행하므로, 필요 샘플 수 대비 실행 가능성은 "표본 부족"이 아니라
# "예상 실험 기간"으로 판단한다.
traffic_estimation:
  historical_order_count: 12210
  historical_period_days: 693
  estimated_daily_orders: 17.6
  estimated_duration_days: 1633
  note: >
    This estimate is based on the historical traffic observed in
    the Olist public dataset (17.6 orders/day for RJ over 693 days).
    It does not represent actual production traffic, which may
    differ substantially in a real business environment. Actual
    experiment duration depends on future incoming traffic, not
    historical data.
  recommendation: >
    If expected production traffic is similar to the historical
    dataset, experiment feasibility should be reviewed by adjusting
    the MDE upward (e.g. 1%p -> 3%p), expanding the target
    population (e.g. including adjacent high-delay states such as
    BA or RS), or redefining the experiment scope.
  status: requires_feasibility_review

# ⑨ 성공 기준
success_criteria:
  - Primary Metric (Delivery Delay Rate) decreases by at least 1.0 percentage point
  - p_value < 0.05
  - Carrier Delivery Time (Secondary Metric) decreases
  - No deterioration in Guardrail Metrics

# ⑩ 실험 결과에 따른 후속 조치
decision:
  if_success: >
    Roll out RJ delivery optimization measures to all fulfillment
    centers serving RJ, and evaluate extending the approach to
    other high-delay states (e.g. BA, RS).
  if_failure: >
    Maintain current logistics process for RJ and reassess the
    improvement strategy, potentially revisiting the root cause
    analysis or exploring alternative interventions.