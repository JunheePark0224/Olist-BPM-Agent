# approved_features.yaml
#
# ④ Root Cause Analysis 단계의 Human Review 승인 결과 (Human Input)
#
# LLM이 candidate_features_{stage}.md에서 제안한 후보 중,
# 노트북에서 이미 검증된 변수 + 인과 스토리가 타당한 변수만 승인했다.
#
# 제외한 후보와 이유:
# - customer_city, seller_city: state보다 카디널리티가 너무 높아
#   η² 계산이 불안정하고 해석도 어려움
# - order_purchase_timestamp 월/요일: Indirect 변수라 이번 라운드는 제외
# - shipping_limit_date: "기한"이라는 성격상 단순 η²/r²보다
#   별도 분석(기한 초과 여부 등)이 더 적합해 보임
# - freight_value, product_length/height/width_cm: 노트북에서
#   다루지 않았고 product_weight_g와 상관성이 높아 중복 신호일 가능성
# - product_photos_qty, product_description_lenght, payment_installments:
#   인과 스토리가 억지스러움
#
# 역할 분리:
# - data_dictionary.json → 데이터가 어디 있는지 (메타데이터)
# - approved_features.yaml (이 파일) → 어떤 Feature를 쓸지 (분석 정책)
# - Python → 두 파일을 합쳐 실제 분석 수행
#
# categorical/continuous 구분은 Python이 η²(범주형, ANOVA)와
# r²(연속형, Pearson) 중 어떤 공식으로 계산할지 바로 분기하기 위해 필요하다.
#
# derived는 원본 컬럼에 없는 파생 변수(월/요일 추출)를 만드는 방법을 명시한다.
# 이렇게 데이터로 남겨두면 Python이 하드코딩 없이 자동으로 생성할 수 있고,
# LLM도 (주석과 달리) 이 정보를 그대로 읽고 이해할 수 있다.

# 덱에 표시할 변수 이름. ⑧ Report Builder가 원시 컬럼명(customer_state,
# carrier_month=3.0) 대신 이 이름을 쓴다. 없는 변수는 컬럼명 그대로 표시된다.
# 값의 표시 형식은 derived의 extract 유형에서 자동 결정된다
# (month → "3월", dayofweek → "금요일").
display_names:
  customer_state: 고객 주(州)
  seller_state: 셀러 주(州)
  product_category_name_english: 상품 카테고리
  carrier_month: 배송 월
  carrier_dayofweek: 배송 요일
  seller_month: 승인 월
  seller_dayofweek: 승인 요일
  product_weight_g: 상품 무게

carrier_delivery:
  categorical:
    - customer_state
    - seller_state
    - product_category_name_english
    - carrier_month
    - carrier_dayofweek
  continuous:
    - product_weight_g
  derived:
    carrier_month:
      source: order_delivered_carrier_date
      extract: month
    carrier_dayofweek:
      source: order_delivered_carrier_date
      extract: dayofweek

seller_processing:
  categorical:
    - seller_state
    - product_category_name_english
    - seller_month
    - seller_dayofweek
  continuous:
    - product_weight_g
  derived:
    seller_month:
      source: order_approved_at
      extract: month
    seller_dayofweek:
      source: order_approved_at
      extract: dayofweek