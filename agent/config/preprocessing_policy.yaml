# preprocessing_policy.yaml
#
# ② 전처리 단계에서 사용하는 전처리 정책 파일 (Human Input)
# Agent(Python Tool)는 이 정책의 타당성을 판단하지 않고,
# 정의된 순서(filters → drop_negative → drop_na_columns)대로 실행만 한다.
#
# 근거 (노트북 01_Preprocessing.ipynb 분석 기준):
# - order_status == 'delivered'가 아닌 주문은 분석 대상에서 제외
# - seller_processing_time, carrier_delivery_time의 음수값은
#   타임스탬프 기록 오류로 판단하여 제거 (총 1,373건, 전체의 약 1.4%)
# - 핵심 timestamp 컬럼 결측치가 있는 행은 분석 불가로 판단하여 제거
# - 극단값(예: carrier_delivery_time 최대 4,924시간)은 실제 발생한
#   지연 사례로 판단하여 제거하지 않고 유지 (keep_outliers: true)

filters:
  order_status: delivered

drop_negative:
  - seller_processing_time
  - carrier_delivery_time

drop_na_columns:
  - order_approved_at
  - order_delivered_carrier_date
  - order_delivered_customer_date

keep_outliers: true